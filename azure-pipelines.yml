trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

# Keep the image tag in sync with the @playwright/test version in package.json.
container: mcr.microsoft.com/playwright:v1.64.1-noble

variables:
  CI: 'true'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # BASE_URL can be defined as a pipeline variable: it is exposed as an env var.

steps:
  - checkout: self

  - script: |
      if [ -f pnpm-lock.yaml ]; then corepack pnpm install --frozen-lockfile; else corepack pnpm install; fi
    displayName: Install dependencies

  - script: corepack pnpm typecheck
    displayName: Type-check

  - script: corepack pnpm lint
    displayName: Lint

  - script: corepack pnpm test
    displayName: Run tests
    # Secret variables are not exposed automatically. Define E2E_USERS as a secret
    # pipeline variable and uncomment these lines:
    # env:
    #   E2E_USERS: $(E2E_USERS)

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/junit.xml
      testRunTitle: E2E
      failTaskOnMissingResultsFile: false

  - task: PublishPipelineArtifact@1
    displayName: Upload report on failure
    condition: failed()
    inputs:
      targetPath: playwright-report
      artifact: playwright-report
